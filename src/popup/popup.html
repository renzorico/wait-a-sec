<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wait a Sec</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">

      <header class="header">
        <span class="logo">wait a sec</span>
        <label class="toggle" title="Enable / disable globally">
          <input type="checkbox" id="global-enabled" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </header>

      <!-- Aggregate stats -->
      <section class="totals" id="totals">
        <div class="total-item">
          <span class="total-value" id="total-attempts">--</span>
          <span class="total-label">pauses</span>
        </div>
        <div class="total-item">
          <span class="total-value proceeded" id="total-proceeded">--</span>
          <span class="total-label">continued</span>
        </div>
        <div class="total-item">
          <span class="total-value skipped" id="total-skipped">--</span>
          <span class="total-label">turned back</span>
        </div>
      </section>

      <!-- Per-site list -->
      <ul class="site-list" id="site-list">
        <!-- populated by JS -->
      </ul>

      <div class="empty" id="empty" hidden>
        <p>No sites added yet</p>
      </div>

      <footer class="footer">
        <button class="btn-settings" id="btn-settings">Open settings</button>
      </footer>

    </div>
    <script type="module" src="popup.ts"></script>
  </body>
</html>
